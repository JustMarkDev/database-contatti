name: Release

on:
  # Called by semantic-release.yml: tags pushed with GITHUB_TOKEN start no workflow.
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  # Manual retry for a tag whose build failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged commit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # keep in sync with devEngines in package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit,cargo-nextest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run required checks
        run: bun run check
      - name: Run tests
        run: bun run test
      - name: Audit dependencies
        run: bun run audit

  build:
    name: Build Windows bundles
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # keep in sync with devEngines in package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Stamp release version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: bun .github/scripts/set-version.mjs "$TAG"
      # The extra config turns on signed updater artifacts for Windows only; the app
      # downloads them through latest.json (see src/updater.rs).
      - name: Build Tauri bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri build --config src-tauri/tauri.updater.conf.json
      - name: Validate expected installers
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -File -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File -ErrorAction SilentlyContinue)
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) {
            throw "Expected both MSI and NSIS installers, found $($msi.Count) MSI and $($nsis.Count) NSIS."
          }
          if (-not (Test-Path "$($msi[0].FullName).sig") -or -not (Test-Path "$($nsis[0].FullName).sig")) {
            throw "Expected a .sig next to each installer; is TAURI_SIGNING_PRIVATE_KEY set?"
          }
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi.sig release-assets/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe.sig release-assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-contatti-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} bundle
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    # No Apple Developer signing or notarization credentials are used. The
    # ad-hoc identity lets macOS package the unsigned distribution artifact.
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # keep in sync with devEngines in package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Stamp release version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: bun .github/scripts/set-version.mjs "$TAG"
      - name: Build Tauri bundle
        run: bun run tauri build --target ${{ matrix.target }}
      - name: Validate expected DMG
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dmg_dir="src-tauri/target/${TARGET}/release/bundle/dmg"
          shopt -s nullglob
          dmg_files=("${dmg_dir}"/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            echo "Expected exactly one DMG in ${dmg_dir}, found ${#dmg_files[@]}." >&2
            exit 1
          fi
      - name: Stage release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg_dir="src-tauri/target/${TARGET}/release/bundle/dmg"
          mkdir -p release-assets
          cp "${dmg_dir}"/*.dmg "release-assets/database-contatti-${ARCH}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-contatti-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - verify
      - build
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-contatti-windows
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-contatti-macos-intel
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-contatti-macos-apple-silicon
          path: release-assets
      - name: Validate downloaded release assets
        shell: bash
        run: |
          shopt -s nullglob
          msi=(release-assets/*.msi)
          nsis=(release-assets/*-setup.exe)
          dmg=(release-assets/*.dmg)
          test "${#msi[@]}" -gt 0
          test "${#nsis[@]}" -gt 0
          test "${#dmg[@]}" -eq 2
      - name: Write updater manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: node .github/scripts/updater-manifest.mjs "$TAG" "$GITHUB_REPOSITORY" release-assets > release-assets/latest.json
      # semantic-release drafts the release with notes; a manual retry may find none.
      - name: Upload assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --generate-notes
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest
