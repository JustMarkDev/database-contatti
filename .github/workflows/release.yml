name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged commit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # keep in sync with devEngines in package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit,cargo-nextest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run required checks
        run: bun run check
      - name: Run tests
        run: bun run test
      - name: Audit dependencies
        run: bun run audit

  build:
    name: Build Windows bundles
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # keep in sync with devEngines in package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Tauri bundles
        run: bun run tauri build
      - name: Validate expected installers
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -Path src-tauri/target/release/bundle/msi -Filter *.msi -File -ErrorAction SilentlyContinue)
          $nsis = @(Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *-setup.exe -File -ErrorAction SilentlyContinue)
          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) {
            throw "Expected both MSI and NSIS installers, found $($msi.Count) MSI and $($nsis.Count) NSIS."
          }
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-contatti-windows
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }} bundle
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    # No Apple Developer signing or notarization credentials are used. The
    # ad-hoc identity lets macOS package the unsigned distribution artifact.
    env:
      APPLE_SIGNING_IDENTITY: "-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # keep in sync with devEngines in package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build Tauri bundle
        run: bun run tauri build --target ${{ matrix.target }}
      - name: Validate expected DMG
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dmg_dir="src-tauri/target/${TARGET}/release/bundle/dmg"
          shopt -s nullglob
          dmg_files=("${dmg_dir}"/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            echo "Expected exactly one DMG in ${dmg_dir}, found ${#dmg_files[@]}." >&2
            exit 1
          fi
      - name: Stage release asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          dmg_dir="src-tauri/target/${TARGET}/release/bundle/dmg"
          mkdir -p release-assets
          cp "${dmg_dir}"/*.dmg "release-assets/database-contatti-${ARCH}.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-contatti-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - verify
      - build
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-contatti-windows
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-contatti-macos-intel
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: database-contatti-macos-apple-silicon
          path: release-assets
      - name: Validate downloaded release assets
        shell: bash
        run: |
          shopt -s nullglob
          msi=(release-assets/*.msi)
          nsis=(release-assets/*-setup.exe)
          dmg=(release-assets/*.dmg)
          test "${#msi[@]}" -gt 0
          test "${#nsis[@]}" -gt 0
          test "${#dmg[@]}" -eq 2
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
